<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRUD dinámico con HTML, CSS y JS">

  <!-- Enlace a Bootstrap CSS -->
  <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
  <!-- Tu archivo CSS personalizado -->
  <link rel="stylesheet" href="styles/style.css">
  <link href="https://fonts.googleapis.com/css?family=Quicksand:600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <title>Crud JS</title>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registrado', reg))
        .catch(err => console.error('Error al registrar el Service Worker', err));
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      let deferredPrompt;
      const installBtn = document.getElementById('installBtn');
      const modalElement= document.getElementById('installModal');
      const confirmInstallBtn = document.getElementById('confirmInstallBtn');

      window.addEventListener('beforeinstallprompt', (e) =>{
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'block';
      });

      installBtn.addEventListener('click', () => {
        const modal = new bootstrap.Modal(document.getElementById('installModal'));
        modal.show();
      })

      confirmInstallBtn.addEventListener('click', async () => {
        if(deferredPrompt){
          const modal = bootstrap.Modal.getInstance(document.getElementById('installModal'));
          if(modal.isVisible()){
            modal.hide();
          }
          
          await deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;

      });

        if(deferredPrompt){
          deferredPrompt.prompt();
          const {outcome} = await deferredPrompt.userChoice;
          console.log(`User response to the install prompt: ${outcome}`);

        }
      });

    });

  </script>

</head>


<body class="container">
  <br/>
  <button id="installBtn" class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#installModal" style="display: none;">
    Instalar aplicacion
  </button>
  <div class="modal fade" id="installModal" tabindex="-1" aria-labelledby="installModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="installModalLabel">Instalar Aplicacion</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"> </button>
        </div>
        <div class="modal-body">
          ¿Quieres instalar esta aplicacion en tu dispositivo?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="confirmInstallBtn">Instalar</button>
        </div>
      </div>
    </div>
  </div>
  <br>
  <!-- Formulario con Bootstrap -->
  <form onsubmit="event.preventDefault();onSubmit();" autocomplete="off" class="mb-4">
    <div class="mb-3">
      <label for="tar" class="form-label">Tarea</label>
      <input type="text" id="tar" class="form-control" placeholder="Escriba aquí" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Escribir</button>
  </form>

  <!-- Tabla con Bootstrap -->
  <div class="table-responsive" id="tableContainer">
    <table class="table table-striped" id="tabla">
      <thead>
        <tr>
          <th scope="col">Tarea</th>
          <th scope="col">Opciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Contenido de la tabla aquí -->
      </tbody>
    </table>
  </div>

  <br/>
  <script type="text/javascript" src="js/crud.js"></script>
  <!-- Enlace a Bootstrap JS -->
  <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
